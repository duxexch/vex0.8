services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vex-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./data:/app/data
      # Wallet WebView APK served by /download/apk (cwd lookup)
      - ./VEX-Deals.apk:/app/VEX-Deals.apk:ro
    environment:
      - NODE_ENV=production
      - PORT=3000
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - APP_URL=${APP_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_BOT_USERNAME=${TELEGRAM_BOT_USERNAME}
      # Secret required by admin money-crediting endpoints (compensation approve,
      # lottery settlement). Fail-closed on the server if unset.
      - ADMIN_TOKEN=${ADMIN_TOKEN}
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: vex-network
