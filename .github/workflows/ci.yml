name: CI/CD Pipeline & Automated SEO Guard

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-build:
    name: Build, Lint & SEO Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: TypeScript Type Checking (Lint)
        run: npm run lint

      - name: Run Automated SEO, Crawlability & Multi-Domain Audit Harness
        run: npm run seo:audit

      - name: Build Production Assets & Server Bundle
        run: npm run build

      - name: Verify Production Output Artifacts
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -f dist/server.cjs || { echo "Missing dist/server.cjs"; exit 1; }
          echo "✅ Production artifacts verified successfully."
